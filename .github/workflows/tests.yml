name: Tests

on:
  push:
    branches:
      - feature/industrial-process-engineering-toolkit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q
